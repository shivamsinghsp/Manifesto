    <rect class="dg-f-panel dg-s-line" x="300" y="40" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Authentication</text><line class="dg-s-line" x1="400" y1="80" x2="400" y2="120" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><rect class="dg-f-panel dg-s-line" x="300" y="120" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">NextAuth.js</text><text class="dg-f-text2" x="400" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">with Rate Limiter</text><path class="dg-s-line" d="M 400 160 L 400 180 L 250 180 L 250 200" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><path class="dg-s-line" d="M 400 160 L 400 180 L 550 180 L 550 200" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><rect class="dg-f-panel dg-s-line" x="170" y="200" width="160" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="250" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Google OAuth</text><rect class="dg-f-panel dg-s-line" x="470" y="200" width="160" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="550" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Email / Password</text><path class="dg-s-line" d="M 250 240 L 250 260 L 400 260 L 400 280" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><path class="dg-s-line" d="M 550 240 L 550 260 L 400 260 L 400 280" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><rect class="dg-f-panel dg-s-line" x="300" y="280" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Session Identity</text><line class="dg-s-line" x1="400" y1="320" x2="400" y2="360" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><rect class="dg-f-panel dg-s-line-soft" x="100" y="360" width="600" height="120" rx="4" stroke-width="1" stroke-dasharray="4 4" /><text class="dg-f-text3" x="112" y="380" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ROLE-BASED ACCESS CONTROL (NUMERIC)</text><rect class="dg-f-accent-soft dg-s-accent" x="120" y="400" width="120" height="40" rx="2" stroke-width="1" /><text class="dg-f-accent" x="180" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">100</text><text class="dg-f-text2" x="180" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Super Admin</text><rect class="dg-f-panel dg-s-line" x="270" y="400" width="120" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="330" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">50</text><text class="dg-f-text2" x="330" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Sub Admin</text><rect class="dg-f-panel dg-s-line" x="420" y="400" width="120" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="480" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">20</text><text class="dg-f-text2" x="480" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Employee</text><rect class="dg-f-panel dg-s-line" x="570" y="400" width="120" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="630" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">10</text><text class="dg-f-text2" x="630" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">User</text><path class="dg-s-line" d="M 400 360 L 400 380 L 180 380 L 180 400" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><path class="dg-s-line" d="M 400 360 L 400 380 L 330 380 L 330 400" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><path class="dg-s-line" d="M 400 360 L 400 380 L 480 380 L 480 400" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" /><path class="dg-s-line" d="M 400 360 L 400 380 L 630 380 L 630 400" fill="none" stroke-width="1" marker-end="url(#shynr-auth-rbac-arrow)" />
