<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
    <style>
      text { user-select: none; }
    </style>
    
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.3)" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00FFFF" />
    </marker>
  </defs>

    <rect x="350" y="20" width="100" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="400" y="38" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">User</text><text x="400" y="52" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Mobile/Desktop</text><line x1="400" y1="60" x2="400" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="300" y="100" width="200" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="400" y="118" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">navigator.geolocation</text><text x="400" y="132" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Browser API</text><line x1="400" y1="140" x2="400" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="370" y="150" width="60" height="20" fill="#0A0A0A" /><text x="400" y="163" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9">Lat / Lng</text><rect x="300" y="180" width="200" height="40" rx="2" stroke="#00FFFF" stroke-width="1" fill="rgba(0,255,255,0.05)" /><text x="400" y="198" text-anchor="middle" fill="#00FFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">/api/attendance/mark</text><text x="400" y="212" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Next.js API</text><line x1="400" y1="220" x2="400" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="270" y="260" width="260" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="400" y="278" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Fetch Company Locations</text><text x="400" y="292" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">MongoDB ($near disabled, exact fetch)</text><line x1="400" y1="300" x2="400" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="250" y="340" width="300" height="40" rx="2" stroke="#00FFFF" stroke-width="1" fill="rgba(0,255,255,0.05)" /><text x="400" y="358" text-anchor="middle" fill="#00FFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Haversine Formula Calculation</text><text x="400" y="372" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">R = 6371e3</text><line x1="400" y1="380" x2="400" y2="420" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="300" y="420" width="200" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="400" y="444" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Distance <= Radius?</text><path d="M 400 460 L 400 480 L 250 480 L 250 500" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><path d="M 400 460 L 400 480 L 550 480 L 550 500" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="180" y="500" width="140" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="250" y="518" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">REJECT</text><text x="250" y="532" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Out of bounds</text><rect x="480" y="500" width="140" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="550" y="518" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">YES</text><text x="550" y="532" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Within 100m - 5000m</text><line x1="550" y1="540" x2="550" y2="580" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="450" y="580" width="200" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="550" y="598" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">UTC Timestamp</text><text x="550" y="612" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">System Time</text><line x1="550" y1="620" x2="550" y2="660" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="450" y="660" width="200" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="550" y="678" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">date-fns-tz</text><text x="550" y="692" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Convert to Asia/Kolkata</text><line x1="550" y1="700" x2="550" y2="740" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="450" y="740" width="200" height="40" rx="2" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="rgba(255,255,255,0.02)" /><text x="550" y="758" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Working-hour Validation</text><text x="550" y="772" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">e.g. 9-10 AM Check-in</text><line x1="550" y1="780" x2="550" y2="820" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrow)" /><rect x="450" y="820" width="200" height="40" rx="2" stroke="#00FFFF" stroke-width="1" fill="rgba(0,255,255,0.05)" /><text x="550" y="838" text-anchor="middle" fill="#00FFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Attendance Record</text><text x="550" y="852" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="9">Saved to MongoDB</text>
  </svg>