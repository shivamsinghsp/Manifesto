<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900"><style>
.dg-f-text{fill:var(--dg-text,#f1f3f7)}.dg-f-text2{fill:var(--dg-text-2,#a8afbf)}.dg-f-text3{fill:var(--dg-text-3,#8590a4)}
.dg-f-line{fill:var(--dg-line,rgba(255,255,255,.28))}.dg-f-panel{fill:var(--dg-panel,rgba(255,255,255,.03))}
.dg-f-surface{fill:var(--dg-surface,#111728)}.dg-f-bg{fill:var(--dg-bg,#0a0e17)}
.dg-f-accent{fill:var(--dg-accent,#00e5ff)}.dg-f-accent-soft{fill:var(--dg-accent-soft,rgba(0,229,255,.07))}
.dg-f-ok{fill:var(--dg-ok,#10b981)}.dg-f-warn{fill:var(--dg-warn,#f59e0b)}
.dg-s-line{stroke:var(--dg-line,rgba(255,255,255,.28))}.dg-s-line-soft{stroke:var(--dg-line-soft,rgba(255,255,255,.12))}
.dg-s-line-strong{stroke:var(--dg-line-strong,#334155)}.dg-s-accent{stroke:var(--dg-accent,#00e5ff)}
.dg-s-ok{stroke:var(--dg-ok,#10b981)}.dg-s-text2{stroke:var(--dg-text-2,#a8afbf)}

</style>
    
    
  <defs>
    <marker id="shynr-attendance-geofencing-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="dg-f-text3" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="shynr-attendance-geofencing-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="dg-f-accent" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>

    <rect class="dg-f-panel dg-s-line" x="350" y="20" width="100" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">User</text><text class="dg-f-text2" x="400" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Mobile/Desktop</text><line class="dg-s-line" x1="400" y1="60" x2="400" y2="100" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="300" y="100" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">navigator.geolocation</text><text class="dg-f-text2" x="400" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Browser API</text><line class="dg-s-line" x1="400" y1="140" x2="400" y2="180" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-bg" x="370" y="150" width="60" height="20" /><text class="dg-f-text2" x="400" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Lat / Lng</text><rect class="dg-f-accent-soft dg-s-accent" x="300" y="180" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-accent" x="400" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">/api/attendance/mark</text><text class="dg-f-text2" x="400" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Next.js API</text><line class="dg-s-line" x1="400" y1="220" x2="400" y2="260" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="270" y="260" width="260" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Fetch Company Locations</text><text class="dg-f-text2" x="400" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">MongoDB ($near disabled, exact fetch)</text><line class="dg-s-line" x1="400" y1="300" x2="400" y2="340" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-accent-soft dg-s-accent" x="250" y="340" width="300" height="40" rx="2" stroke-width="1" /><text class="dg-f-accent" x="400" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Haversine Formula Calculation</text><text class="dg-f-text2" x="400" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">R = 6371e3</text><line class="dg-s-line" x1="400" y1="380" x2="400" y2="420" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="300" y="420" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="400" y="444" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Distance <= Radius?</text><path class="dg-s-line" d="M 400 460 L 400 480 L 250 480 L 250 500" fill="none" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><path class="dg-s-line" d="M 400 460 L 400 480 L 550 480 L 550 500" fill="none" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="180" y="500" width="140" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="250" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">REJECT</text><text class="dg-f-text2" x="250" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Out of bounds</text><rect class="dg-f-panel dg-s-line" x="480" y="500" width="140" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="550" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">YES</text><text class="dg-f-text2" x="550" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Within 100m - 5000m</text><line class="dg-s-line" x1="550" y1="540" x2="550" y2="580" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="450" y="580" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="550" y="598" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">UTC Timestamp</text><text class="dg-f-text2" x="550" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">System Time</text><line class="dg-s-line" x1="550" y1="620" x2="550" y2="660" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="450" y="660" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="550" y="678" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">date-fns-tz</text><text class="dg-f-text2" x="550" y="692" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Convert to Asia/Kolkata</text><line class="dg-s-line" x1="550" y1="700" x2="550" y2="740" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-panel dg-s-line" x="450" y="740" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-text" x="550" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Working-hour Validation</text><text class="dg-f-text2" x="550" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">e.g. 9-10 AM Check-in</text><line class="dg-s-line" x1="550" y1="780" x2="550" y2="820" stroke-width="1" marker-end="url(#shynr-attendance-geofencing-arrow)" /><rect class="dg-f-accent-soft dg-s-accent" x="450" y="820" width="200" height="40" rx="2" stroke-width="1" /><text class="dg-f-accent" x="550" y="838" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Attendance Record</text><text class="dg-f-text2" x="550" y="852" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9">Saved to MongoDB</text>
  </svg>