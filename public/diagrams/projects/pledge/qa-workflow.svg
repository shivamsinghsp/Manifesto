<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <rect width="800" height="360" rx="12" fill="#0A0E17"/>
  <rect x="0.5" y="0.5" width="799" height="359" rx="11.5" stroke="#1E293B"/>
  
  <!-- Blueprint grid background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#grid)" />

  <!-- Header -->
  <text x="40" y="45" fill="#00E5FF" font-family="monospace" font-size="12" letter-spacing="2">PLEDGE PORTAL // QA VERIFICATION LIFECYCLE</text>
  <text x="40" y="68" fill="#F1F5F9" font-family="serif" font-size="18" font-weight="bold">Functional &amp; Regression Testing Protocol</text>

  <!-- Step 1 -->
  <g transform="translate(40, 110)">
    <rect width="120" height="140" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="32" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="bold">01. INTAKE</text>
    <text x="14" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Requirement</text>
    <text x="14" y="74" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Analysis</text>
    <text x="14" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Acceptance criteria &amp;</text>
    <text x="14" y="114" fill="#94A3B8" font-family="sans-serif" font-size="10">role permission maps</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 165 180 L 185 180" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon points="185,177 192,180 185,183" fill="#00E5FF"/>

  <!-- Step 2 -->
  <g transform="translate(195, 110)">
    <rect width="125" height="140" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="32" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="bold">02. EXECUTION</text>
    <text x="14" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Functional Test</text>
    <text x="14" y="74" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Suites</text>
    <text x="14" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Cross-role workflows,</text>
    <text x="14" y="114" fill="#94A3B8" font-family="sans-serif" font-size="10">form boundary testing</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 325 180 L 345 180" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon points="345,177 352,180 345,183" fill="#00E5FF"/>

  <!-- Step 3 -->
  <g transform="translate(355, 110)">
    <rect width="125" height="140" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="32" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">03. LOGGING</text>
    <text x="14" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Defect</text>
    <text x="14" y="74" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Documentation</text>
    <text x="14" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Reproducible steps,</text>
    <text x="14" y="114" fill="#94A3B8" font-family="sans-serif" font-size="10">severity assessment</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 485 180 L 505 180" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon points="505,177 512,180 505,183" fill="#00E5FF"/>

  <!-- Step 4 -->
  <g transform="translate(515, 110)">
    <rect width="115" height="140" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">04. RETEST</text>
    <text x="14" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Regression</text>
    <text x="14" y="74" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Verification</text>
    <text x="14" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Fix validation &amp;</text>
    <text x="14" y="114" fill="#94A3B8" font-family="sans-serif" font-size="10">side-effect checks</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 635 180 L 655 180" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon points="655,177 662,180 655,183" fill="#00E5FF"/>

  <!-- Step 5 -->
  <g transform="translate(665, 110)">
    <rect width="95" height="140" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="12" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">05. SIGN-OFF</text>
    <text x="12" y="58" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Staging</text>
    <text x="12" y="74" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Release</text>
    <text x="12" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Ready for</text>
    <text x="12" y="114" fill="#94A3B8" font-family="sans-serif" font-size="10">deployment</text>
  </g>

  <!-- Footer note -->
  <text x="40" y="300" fill="#64748B" font-family="monospace" font-size="11">// Rigorous manual QA protocol — ensuring multi-tier role integrity without fabricating test automation</text>
</svg>