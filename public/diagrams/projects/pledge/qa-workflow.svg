<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" fill="none"><style>
.dg-f-text{fill:var(--dg-text,#f1f3f7)}.dg-f-text2{fill:var(--dg-text-2,#a8afbf)}.dg-f-text3{fill:var(--dg-text-3,#8590a4)}
.dg-f-line{fill:var(--dg-line,rgba(255,255,255,.28))}.dg-f-panel{fill:var(--dg-panel,rgba(255,255,255,.03))}
.dg-f-surface{fill:var(--dg-surface,#111728)}.dg-f-bg{fill:var(--dg-bg,#0a0e17)}
.dg-f-accent{fill:var(--dg-accent,#00e5ff)}.dg-f-accent-soft{fill:var(--dg-accent-soft,rgba(0,229,255,.07))}
.dg-f-ok{fill:var(--dg-ok,#10b981)}.dg-f-warn{fill:var(--dg-warn,#f59e0b)}
.dg-s-line{stroke:var(--dg-line,rgba(255,255,255,.28))}.dg-s-line-soft{stroke:var(--dg-line-soft,rgba(255,255,255,.12))}
.dg-s-line-strong{stroke:var(--dg-line-strong,#334155)}.dg-s-accent{stroke:var(--dg-accent,#00e5ff)}
.dg-s-ok{stroke:var(--dg-ok,#10b981)}.dg-s-text2{stroke:var(--dg-text-2,#a8afbf)}

</style>
  <rect class="dg-f-bg" width="800" height="360" rx="12"/>
  <rect class="dg-s-line-soft" x="0.5" y="0.5" width="799" height="359" rx="11.5"/>
  
  <!-- Blueprint grid background -->
  <defs>
    <pattern id="pledge-qa-workflow-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path class="dg-s-line-soft" d="M 20 0 L 0 0 0 20" fill="none" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#pledge-qa-workflow-grid)" />

  <!-- Header -->
  <text class="dg-f-accent" x="40" y="45" font-family="monospace" font-size="12" letter-spacing="2">PLEDGE PORTAL // QA VERIFICATION LIFECYCLE</text>
  <text class="dg-f-text" x="40" y="68" font-family="serif" font-size="18" font-weight="bold">Functional &amp; Regression Testing Protocol</text>

  <!-- Step 1 -->
  <g transform="translate(40, 110)">
    <rect class="dg-f-surface dg-s-line-strong" width="120" height="140" rx="8" stroke-width="1"/>
    <text class="dg-f-accent" x="14" y="32" font-family="monospace" font-size="11" font-weight="bold">01. INTAKE</text>
    <text class="dg-f-text" x="14" y="58" font-family="sans-serif" font-size="12" font-weight="600">Requirement</text>
    <text class="dg-f-text" x="14" y="74" font-family="sans-serif" font-size="12" font-weight="600">Analysis</text>
    <text class="dg-f-text2" x="14" y="100" font-family="sans-serif" font-size="10">Acceptance criteria &amp;</text>
    <text class="dg-f-text2" x="14" y="114" font-family="sans-serif" font-size="10">role permission maps</text>
  </g>

  <!-- Arrow 1-2 -->
  <path class="dg-s-accent" d="M 165 180 L 185 180" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon class="dg-f-accent" points="185,177 192,180 185,183"/>

  <!-- Step 2 -->
  <g transform="translate(195, 110)">
    <rect class="dg-f-surface dg-s-line-strong" width="125" height="140" rx="8" stroke-width="1"/>
    <text class="dg-f-accent" x="14" y="32" font-family="monospace" font-size="11" font-weight="bold">02. EXECUTION</text>
    <text class="dg-f-text" x="14" y="58" font-family="sans-serif" font-size="12" font-weight="600">Functional Test</text>
    <text class="dg-f-text" x="14" y="74" font-family="sans-serif" font-size="12" font-weight="600">Suites</text>
    <text class="dg-f-text2" x="14" y="100" font-family="sans-serif" font-size="10">Cross-role workflows,</text>
    <text class="dg-f-text2" x="14" y="114" font-family="sans-serif" font-size="10">form boundary testing</text>
  </g>

  <!-- Arrow 2-3 -->
  <path class="dg-s-accent" d="M 325 180 L 345 180" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon class="dg-f-accent" points="345,177 352,180 345,183"/>

  <!-- Step 3 -->
  <g transform="translate(355, 110)">
    <rect class="dg-f-surface dg-s-line-strong" width="125" height="140" rx="8" stroke-width="1"/>
    <text class="dg-f-warn" x="14" y="32" font-family="monospace" font-size="11" font-weight="bold">03. LOGGING</text>
    <text class="dg-f-text" x="14" y="58" font-family="sans-serif" font-size="12" font-weight="600">Defect</text>
    <text class="dg-f-text" x="14" y="74" font-family="sans-serif" font-size="12" font-weight="600">Documentation</text>
    <text class="dg-f-text2" x="14" y="100" font-family="sans-serif" font-size="10">Reproducible steps,</text>
    <text class="dg-f-text2" x="14" y="114" font-family="sans-serif" font-size="10">severity assessment</text>
  </g>

  <!-- Arrow 3-4 -->
  <path class="dg-s-accent" d="M 485 180 L 505 180" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon class="dg-f-accent" points="505,177 512,180 505,183"/>

  <!-- Step 4 -->
  <g transform="translate(515, 110)">
    <rect class="dg-f-surface dg-s-line-strong" width="115" height="140" rx="8" stroke-width="1"/>
    <text class="dg-f-ok" x="14" y="32" font-family="monospace" font-size="11" font-weight="bold">04. RETEST</text>
    <text class="dg-f-text" x="14" y="58" font-family="sans-serif" font-size="12" font-weight="600">Regression</text>
    <text class="dg-f-text" x="14" y="74" font-family="sans-serif" font-size="12" font-weight="600">Verification</text>
    <text class="dg-f-text2" x="14" y="100" font-family="sans-serif" font-size="10">Fix validation &amp;</text>
    <text class="dg-f-text2" x="14" y="114" font-family="sans-serif" font-size="10">side-effect checks</text>
  </g>

  <!-- Arrow 4-5 -->
  <path class="dg-s-accent" d="M 635 180 L 655 180" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon class="dg-f-accent" points="655,177 662,180 655,183"/>

  <!-- Step 5 -->
  <g transform="translate(665, 110)">
    <rect class="dg-f-surface dg-s-ok" width="95" height="140" rx="8" stroke-width="1.5"/>
    <text class="dg-f-ok" x="12" y="32" font-family="monospace" font-size="11" font-weight="bold">05. VERIFY</text>
    <text class="dg-f-text" x="12" y="58" font-family="sans-serif" font-size="12" font-weight="600">Staging</text>
    <text class="dg-f-text" x="12" y="74" font-family="sans-serif" font-size="12" font-weight="600">Report</text>
    <text class="dg-f-text2" x="12" y="100" font-family="sans-serif" font-size="10">Verified for</text>
    <text class="dg-f-text2" x="12" y="114" font-family="sans-serif" font-size="10">lead sign-off</text>
  </g>

  <!-- Footer note -->
  <text class="dg-f-text3" x="40" y="300" font-family="monospace" font-size="11">// Rigorous manual QA protocol — ensuring multi-tier role integrity without fabricating test automation</text>
</svg>
